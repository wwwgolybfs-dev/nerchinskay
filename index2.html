<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="color-scheme" content="dark">
<meta name="description" content="Trek Fit — дневник тренировок, питания и прогресса">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trek Fit">
<title>Trek Fit — дневник тренировок</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- Telegram Mini App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Стили: сначала вкладки (style.css), затем каркас (shell.css) -->
<link rel="stylesheet" href="style.css?v=8">
<link rel="stylesheet" href="shell.css?v=1">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.6 12 3l9 7.6V20a1.4 1.4 0 0 1-1.4 1.4H15v-6.6H9v6.6H4.4A1.4 1.4 0 0 1 3 20z"/></symbol>
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M3.5 9.5v5M6.5 7.5v9M17.5 7.5v9M20.5 9.5v5M6.5 12h11"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M8 15a4 4 0 0 1 8 0M12 11.5l2-2.5"/></symbol>
    <symbol id="i-calc" viewBox="0 0 24 24"><rect x="4.5" y="3.5" width="15" height="17" rx="2.5"/><path d="M8 8h8M8 12h2M12 12h2M16 12h.01M8 16h2M12 16h2M16 16h.01"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3s5 4.4 5 9a5 5 0 0 1-10 0c0-1.8.8-3.4 1.8-4.6C9.7 9 12 8 12 3Z"/></symbol>
    <symbol id="i-trend-up" viewBox="0 0 24 24"><path d="M3.5 16.5 9 11l4 4 7.5-7.5"/><path d="M15.5 7.5H20v4.5"/></symbol>
    <symbol id="i-trend-down" viewBox="0 0 24 24"><path d="M3.5 7.5 9 13l4-4 7.5 7.5"/><path d="M15.5 16.5H20V12"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="15" rx="2.5"/><path d="M8 3.5v4M16 3.5v4M3.5 10.5h17"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 5.5H4.5V7a3.5 3.5 0 0 0 3.5 3.5M17 5.5h2.5V7A3.5 3.5 0 0 1 16 10.5"/><path d="M12 13v3.5M8.5 20.5h7"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4.5H6.5A1.5 1.5 0 0 0 5 6v12a1.5 1.5 0 0 0 1.5 1.5H14"/><path d="M17 8.5 20.5 12 17 15.5M10 12h10.5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 5.5v-1a1 1 0 0 0-1-1h-9a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h1"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v10m0 0 4-4m-4 4-4-4"/><path d="M4.5 18.5h15"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4.5V10h-5.5"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-droplet" viewBox="0 0 24 24"><path d="M12 3.5c3 3.6 5.5 6.6 5.5 9.6a5.5 5.5 0 0 1-11 0c0-3 2.5-6 5.5-9.6Z"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12.5 5 5 10-11"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8.5a6 6 0 1 0-12 0c0 5-2 6.5-2 6.5h16s-2-1.5-2-6.5Z"/><path d="M10 19a2.2 2.2 0 0 0 4 0"/></symbol>
    <symbol id="i-apple" viewBox="0 0 24 24"><path d="M12 7.5c-3.3 0-5.5 2.6-5.5 6 0 3.6 2.4 7 4.6 7 .9 0 1.2-.5 2.1-.5s1.2.5 2.1.5c2 0 3.2-2.6 3.2-2.6-1.8-.9-2.4-2.3-2.4-3.6 0-1.6 1.3-2.5 1.3-2.5-1-1.5-2.6-1.8-3.4-1.8-.8 0-1.4.5-2 .5s-1.2-.5-2-.5"/><path d="M12 7.5c0-1.8 1.2-3.5 3-4"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4.5 13.5H11l-1 8.5L19 10h-6.5z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-csv" viewBox="0 0 24 24"><path d="M7 3.5h7l4.5 4.5V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M14 3.5V8h4.5M9 13.5h6M9 17h4"/></symbol>
  </defs>
</svg>

<!-- ================= ВХОД (браузер вне Telegram) ================= -->
<div class="auth hidden" id="auth">
  <div class="auth-box">
    <div class="brand-mark"><svg><use href="#i-dumbbell"/></svg></div>
    <h2>Вход в Trek Fit</h2>
    <p>Введи код синхронизации из раздела «Профиль» в Telegram-приложении</p>
    <input id="sync-input" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" inputmode="text" aria-label="Код синхронизации" autofocus>
    <button class="btn" id="sync-btn" type="button">
      <svg><use href="#i-chevron"/></svg>Войти
    </button>
  </div>
</div>

<!-- ================= ОБОЛОЧКА-ПЕРЕХОДНИК ================= -->
<div class="app hidden" id="shell">

  <!-- Левая панель: единственное меню приложения -->
  <aside class="app-side" id="app-side">
    <div class="side-brand">
      <div class="mark"><svg><use href="#i-dumbbell"/></svg></div>
      <div>
        <div class="word">Trek<span>Fit</span></div>
        <span class="kicker">Дневник прогресса</span>
      </div>
    </div>

    <div class="side-label">Дневник</div>
    <nav class="app-nav" aria-label="Разделы">
      <button class="nav-item active" data-nav="home" type="button">
        <span class="nav-ic"><svg><use href="#i-home"/></svg></span>
        <span class="nav-text">Обзор</span>
      </button>
      <button class="nav-item" data-nav="workouts" type="button">
        <span class="nav-ic"><svg><use href="#i-dumbbell"/></svg></span>
        <span class="nav-text">Тренировки</span>
      </button>
      <button class="nav-item" data-nav="nutrition" type="button">
        <span class="nav-ic"><svg><use href="#i-apple"/></svg></span>
        <span class="nav-text">Питание</span>
      </button>
      <button class="nav-item" data-nav="weight" type="button">
        <span class="nav-ic"><svg><use href="#i-scale"/></svg></span>
        <span class="nav-text">Вес и состав</span>
      </button>
    </nav>

    <div class="side-label">Прогресс</div>
    <nav class="app-nav" aria-label="Аналитика">
      <button class="nav-item" data-nav="records" type="button">
        <span class="nav-ic"><svg><use href="#i-trophy"/></svg></span>
        <span class="nav-text">Рекорды</span>
      </button>
      <button class="nav-item" data-nav="calc" type="button">
        <span class="nav-ic"><svg><use href="#i-calc"/></svg></span>
        <span class="nav-text">Расчёты</span>
      </button>
    </nav>

    <div class="side-label">Аккаунт</div>
    <nav class="app-nav" aria-label="Профиль">
      <button class="nav-item" data-nav="profile" type="button">
        <span class="nav-ic"><svg><use href="#i-user"/></svg></span>
        <span class="nav-text">Профиль</span>
        <i class="dot" id="side-profile-dot"></i>
      </button>
    </nav>

    <div class="side-foot">
      <div class="goal-mini side-goal" id="side-goal"></div>
      <div class="side-user">
        <div class="avatar" id="side-avatar">?</div>
        <div class="u-info">
          <div class="u-name" id="sidebar-user">—</div>
          <div class="u-meta" id="side-streak">—</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="app-scrim" id="app-scrim"></div>

  <!-- Контент -->
  <div class="app-main">
    <header class="app-top">
      <button class="app-burger" id="app-burger" type="button" aria-label="Меню" aria-expanded="false" aria-controls="app-side">
        <span></span><span></span><span></span>
      </button>
      <div class="app-crumbs">
        <span>Trek Fit</span>
        <span class="sep">/</span>
        <b id="app-crumb">Обзор</b>
      </div>
      <div class="app-top-right">
        <span class="tag" id="top-streak" title="Дней подряд"><svg style="width:12px;height:12px"><use href="#i-flame"/></svg><span>0</span></span>
        <button class="chip" id="top-bell" type="button" aria-label="Уведомления" style="position:relative;padding:6px 8px">
          <svg style="width:16px;height:16px"><use href="#i-bell"/></svg>
          <i class="dot" id="top-bell-dot" style="position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-radius:50%;background:var(--bad);display:none"></i>
        </button>
        <div class="avatar" id="top-avatar" data-goto="profile" role="button" tabindex="0">?</div>
      </div>
    </header>

    <main class="app-content">
      <div class="page-head">
        <div>
          <h1 id="page-title">Обзор</h1>
          <p id="page-sub">Твой прогресс за последние недели</p>
        </div>
        <div class="page-actions">
          <button class="btn sm ghost" data-goto="workouts" type="button"><svg><use href="#i-plus"/></svg>Подход</button>
          <button class="btn sm" data-goto="weight" type="button"><svg><use href="#i-scale"/></svg>Записать вес</button>
        </div>
      </div>

      <!-- Сюда shell.js собирает pages/*.html -->
      <div id="view" class="view view-loading">
        <i></i><i></i><i></i>
      </div>
    </main>
  </div>
</div>

<!-- Плавающий таймер отдыха (нажмите для +30 сек, крестик для сброса) -->
<button class="rest-timer-fab hidden" id="rest-timer" type="button" title="Нажми для +30 сек">
  <svg style="width:15px;height:15px"><use href="#i-clock"/></svg>
  <span class="num" id="rest-timer-val">01:30</span>
  <span class="row-action" id="rest-timer-close" role="button" aria-label="Сбросить таймер" style="margin-left:2px;display:inline-flex">
    <svg style="width:14px;height:14px"><use href="#i-close"/></svg>
  </span>
</button>

<!-- Пресеты таймера отдыха (долгое нажатие на таймер) -->
<div class="timer-presets hidden" id="timer-presets">
  <button type="button" data-rest="60">1:00</button>
  <button type="button" data-rest="90">1:30</button>
  <button type="button" data-rest="120">2:00</button>
  <button type="button" data-rest="180">3:00</button>
</div>

<!-- Универсальная шторка: активная тренировка, уведомления -->
<div class="sheet-overlay" id="sheet-overlay">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Локальные библиотеки: без CDN, версии зафиксированы -->
<script src="vendor/chart.umd.min.js"></script>
<script src="vendor/supabase.js"></script>

<!-- Оболочка: собирает вкладки и запускает app.js -->
<script src="shell.js"></script>
</body>
</html>
