<!-- Trek Fit · вкладка «workouts» -->
<!-- Фрагмент: подключается в index2.html через loader (fetch → #view) -->

<section class="panel" id="panel-workouts">
  <div class="eyebrow">Программы
    <span class="link" data-goto="records" role="button" tabindex="0">Личные рекорды</span>
  </div>
  <div class="card tight">
    <div id="programs-list" style="display:grid;gap:8px"></div>
    <div class="row" style="margin-top:10px;gap:8px">
      <button class="btn sm ghost" id="start-workout-btn" type="button"><svg><use href="#i-bolt"/></svg>Начать тренировку</button>
      <button class="btn sm ghost" id="save-program-btn" type="button"><svg><use href="#i-plus"/></svg>Из последней</button>
    </div>
  </div>

  <div class="split">
    <div class="sticky">
      <div class="eyebrow">Записать подход</div>
      <div class="card">
        <form id="workout-form" novalidate>
          <div class="field">
            <label for="exercise-select">Упражнение</label>
            <select id="exercise-select" name="exercise" required></select>
          </div>

          <div class="field hidden" id="custom-wrap">
            <label for="custom-exercise">Своё название</label>
            <input id="custom-exercise" name="custom-exercise" type="text" maxlength="60" placeholder="Например, тяга Т-грифа" autocomplete="off">
          </div>

          <div class="field hidden" id="group-wrap">
            <label for="group-select">Группа мышц</label>
            <select id="group-select" name="muscle_group">
              <option value="chest">Грудь</option>
              <option value="back">Спина</option>
              <option value="shoulders">Плечи</option>
              <option value="biceps">Бицепс</option>
              <option value="triceps">Трицепс</option>
              <option value="legs">Ноги</option>
              <option value="abs">Пресс</option>
              <option value="cardio">Кардио</option>
            </select>
          </div>

          <div class="row">
            <div class="field">
              <label for="w-weight">Вес, кг</label>
              <div class="stepper">
                <button type="button" data-step="-2.5" data-for="w-weight" aria-label="Уменьшить вес"><svg style="width:14px;height:14px"><use href="#i-minus"/></svg></button>
                <input id="w-weight" name="weight_kg" type="number" inputmode="decimal" step="0.5" min="0" max="600" placeholder="0">
                <button type="button" data-step="2.5" data-for="w-weight" aria-label="Увеличить вес"><svg style="width:14px;height:14px"><use href="#i-plus"/></svg></button>
              </div>
            </div>
            <div class="field">
              <label for="w-reps">Повторы</label>
              <div class="stepper">
                <button type="button" data-step="-1" data-for="w-reps" aria-label="Меньше повторов"><svg style="width:14px;height:14px"><use href="#i-minus"/></svg></button>
                <input id="w-reps" name="reps" type="number" inputmode="numeric" step="1" min="0" max="500" placeholder="10">
                <button type="button" data-step="1" data-for="w-reps" aria-label="Больше повторов"><svg style="width:14px;height:14px"><use href="#i-plus"/></svg></button>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="w-sets">Подходы</label>
            <div class="stepper">
              <button type="button" data-step="-1" data-for="w-sets" aria-label="Меньше подходов"><svg style="width:14px;height:14px"><use href="#i-minus"/></svg></button>
              <input id="w-sets" name="sets" type="number" inputmode="numeric" step="1" min="1" max="30" value="3">
              <button type="button" data-step="1" data-for="w-sets" aria-label="Больше подходов"><svg style="width:14px;height:14px"><use href="#i-plus"/></svg></button>
            </div>
          </div>

          <div class="sub" id="form-hint">—</div>
          <button class="btn" type="submit"><svg><use href="#i-plus"/></svg>Записать подход</button>
        </form>
      </div>
    </div>

    <div>
      <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
        <div class="kpi">
          <div class="kpi-label">Записей</div>
          <div class="kpi-value num" id="ws-count">—</div>
          <div class="kpi-foot">за 30 дней</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Подходов</div>
          <div class="kpi-value num" id="ws-sets">—</div>
          <div class="kpi-foot">за 30 дней</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Тоннаж</div>
          <div class="kpi-value num" id="ws-tonnage">—</div>
          <div class="kpi-foot">кг за 30 дней</div>
        </div>
      </div>

      <div class="eyebrow">История <span class="sub" style="text-transform:none;letter-spacing:0;font-weight:500">нажми на запись для повтора</span></div>
      <div class="search" style="margin-bottom:8px">
        <svg><use href="#i-search"/></svg>
        <input id="workout-search" type="search" placeholder="Поиск по упражнению" autocomplete="off" aria-label="Поиск по упражнению">
      </div>
      <div class="chips" id="workout-chips">
        <button class="chip active" data-filter="" type="button">Все</button>
        <button class="chip" data-filter="chest" type="button">Грудь</button>
        <button class="chip" data-filter="back" type="button">Спина</button>
        <button class="chip" data-filter="shoulders" type="button">Плечи</button>
        <button class="chip" data-filter="biceps" type="button">Бицепс</button>
        <button class="chip" data-filter="triceps" type="button">Трицепс</button>
        <button class="chip" data-filter="legs" type="button">Ноги</button>
        <button class="chip" data-filter="abs" type="button">Пресс</button>
        <button class="chip" data-filter="cardio" type="button">Кардио</button>
      </div>
      <div class="list" id="workout-list"></div>
    </div>
  </div>
</section>
